<style>
:root{--bg:#0b0d12;--card:rgba(18,22,30,.78);--line:#1f2632;--tx:#cdd4e0;--hint:#929db0;--ac:#e3c570;--bl:#5b8cff;--wa:#f29a4a;--rd:#ff6b6b;--inp:#0d1117;--soft:#ffffff12;--nav:#0b0d12ee;--hero:linear-gradient(135deg,#2b2511,#10203a 85%);--heroline:#4d4222;--msgu:#1c2a44;--msga:#171d27;--navoff:#6b7587}
html[data-theme=light]{--bg:#f2f4f8;--card:#ffffff;--line:#e1e6ee;--tx:#131925;--hint:#5d6a7e;--ac:#9a7410;--bl:#2f5fd0;--wa:#c46a12;--rd:#d63b3b;--inp:#f6f8fb;--soft:#0000000d;--nav:#fffffff2;--hero:linear-gradient(135deg,#fff3d2,#e1eafb 85%);--heroline:#ead9a6;--msgu:#dfe8fb;--msga:#f1f4f9;--navoff:#8a95a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:14px 14px calc(92px + env(safe-area-inset-bottom));background:var(--bg);color:var(--tx);font:500 15px/1.5 'Manrope',-apple-system,Segoe UI,Roboto,sans-serif;font-variant-numeric:tabular-nums}
#app{animation:f .25s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font:700 12px 'Unbounded','Manrope',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);margin:20px 4px 10px}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{background:var(--hero);border-color:var(--heroline)}
.big{font:700 29px/1.15 'Unbounded','Manrope',sans-serif;letter-spacing:-.02em;margin:4px 0}.hint{color:var(--hint);font-size:13px;font-weight:600}b{font-weight:800}
.up{color:var(--ac)}.dn{color:var(--rd)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.row+.row,.sep{border-top:1px solid var(--line)}

.bar{height:7px;background:var(--soft);border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4c7be0,#e8b45a);border-radius:4px}
.tip{border-left:3px solid var(--c,var(--bl))}.tip b{display:block;margin-bottom:4px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-width:68px;background:none;border:0;color:var(--navoff);font-size:9.5px;font-weight:700;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:18px;filter:grayscale(1) opacity(.7)}nav button.on{color:var(--ac)}nav button.on span{filter:none}
input,select,textarea{width:100%;padding:12px;margin:4px 0 8px;border:1px solid var(--line);border-radius:12px;background:var(--inp);color:var(--tx);font:500 16px 'Manrope',sans-serif}
.go{border:0;border-radius:14px;padding:14px;width:100%;font:800 15px 'Manrope',sans-serif;color:#1b1205;background:linear-gradient(135deg,#f3d27a 0%,#f7b34e 22%,#ef8c3a 60%,#3f66d9 125%);box-shadow:0 10px 24px -6px rgba(63,102,217,.75),0 2px 0 rgba(255,236,170,.45) inset;transition:transform .12s,box-shadow .12s}
.go:active{transform:translateY(2px) scale(.97);box-shadow:0 3px 10px -6px rgba(63,102,217,.7),inset 0 3px 9px rgba(0,0,0,.4)}
.go.sm{padding:10px;font-size:13px;margin:8px 0}.go[disabled]{opacity:.6}
label{display:block;margin-top:6px}ul{margin:6px 0 0;padding-left:18px}li{margin:4px 0}
.m{padding:10px 13px;border-radius:14px;margin:8px 0;white-space:pre-wrap;max-width:92%}.m.u{background:var(--msgu);margin-left:auto}.m.a{background:var(--msga);border:1px solid var(--line)}
.q{display:inline-block;margin:4px 4px 0 0;padding:7px 11px;border-radius:20px;border:1px solid var(--line);background:var(--inp);color:var(--tx);font:700 12px 'Manrope',sans-serif}
.q.on{border-color:var(--ac);color:var(--ac)}
.n{font-weight:800}.big .n{font:inherit}
.w{font-family:'Playfair Display',Georgia,serif;font-variant-numeric:lining-nums;font-weight:700;font-size:1.1em;color:var(--ac)}
.inc .big{font:800 40px/1.1 'Playfair Display',Georgia,serif;color:var(--ac);letter-spacing:0}.inc .big .w{font:inherit;color:inherit}
.inc .up{color:var(--ac)}.inc h2{color:var(--ac)}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
radial-gradient(120% 55% at 12% -8%,rgba(48,74,160,.40),transparent 62%),
radial-gradient(95% 50% at 105% 104%,rgba(170,115,40,.24),transparent 62%),
linear-gradient(180deg,#06070d,#0a0d17 55%,#05060a)}
html[data-theme=light] body::before{background:linear-gradient(180deg,#f7f9fc,#e9eef6)}

#fly{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}.tbl td,.tbl th{padding:7px 3px;text-align:right}.tbl td:first-child,.tbl th:first-child{text-align:left}.tbl th{color:var(--hint);font-weight:700;font-size:11px}.tbl tr+tr td{border-top:1px solid var(--line)}
.x{background:none;border:0;color:var(--hint);font-size:17px;padding:2px 6px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;height:50px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.news{display:block;cursor:pointer}.news b{line-height:1.35}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.chips::-webkit-scrollbar{display:none}.chips .q{flex:0 0 auto;margin:0}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font:800 11px 'Manrope',sans-serif;letter-spacing:.05em;margin-bottom:6px}
.t-buy{background:#e3c5702a;color:var(--ac)}.t-sell{background:#f29a4a2a;color:var(--wa)}.t-hold{background:#5b8cff2a;color:var(--bl)}.idea b{display:block}.why{margin-top:5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.sc td,.sc th{padding:7px 2px}
svg text{font-family:'Manrope',sans-serif}
</style></head><body>
<canvas id="sky"></canvas><canvas id="fly"></canvas>
<div id="app" class="hint">Загрузка…</div>
<nav><button data-t="p"><span>💼</span>Портфель</button><button data-t="i"><span>💰</span>Доход</button><button data-t="g"><span>🎯</span>Цели</button><button data-t="pl"><span>🧭</span>План</button><button data-t="n"><span>📰</span>Новости</button><button data-t="an"><span>🔬</span>Анализ</button><button data-t="s"><span>✍️</span>Сделки</button></nav>
<script>
'use strict';
/* ============ Telegram и защита ============ */
const tg=(window.Telegram&&window.Telegram.WebApp)||{};
try{tg.ready();tg.expand()}catch(_){}
const OWNER=8716613685,uid=(tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.id)||0;
if(uid!==OWNER){document.body.innerHTML='<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#929db0;font:600 16px -apple-system,sans-serif;text-align:center;padding:20px"><div style="font-size:42px">🔒</div>Приватное приложение<div style="font-size:13px;font-weight:500">Откройте его из своего бота в Telegram</div></div>';throw new Error('locked')}
const $=id=>document.getElementById(id);
window.onerror=(m,u,l)=>{const a=$('app');if(a)a.innerHTML='<div class="card dn">Ошибка: '+String(m).replace(/</g,'&lt;')+' (строка '+l+')</div>'};

/* ============ форматирование: рубли с копейками, проценты с двумя знаками ============ */
const nfx=d=>new Intl.NumberFormat('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
const nf2=nfx(2),nf1=nfx(1),nf0=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const rd=x=>Math.round((+x||0)*100)/100;
const R=x=>{x=rd(x);return(x<0?'−':'')+nf2.format(Math.abs(x))+' ₽'};      // 209 749,20 ₽
const R0=x=>{x=Math.round(+x||0);return(x<0?'−':'')+nf0.format(Math.abs(x))+' ₽'}; // для целей и прогнозов
const SR=x=>{x=rd(x);return(x<0?'−':'+')+nf2.format(Math.abs(x))+' ₽'};
const P=x=>{x=rd(x);return(x<0?'−':'+')+nf2.format(Math.abs(x))+'%'};        // +6,55%
const W=x=>nf1.format(x)+'%';                                                // доля: 53,9%
const N=x=>nf0.format(x);
const C=x=>rd(x)>=0?'up':'dn';
const Y=m=>m==null?'>60 лет':m==0?'✅ достигнуто':'≈ '+Math.floor(m/12)+' л. '+m%12+' мес.';
const clone=o=>JSON.parse(JSON.stringify(o));
const iso=d=>d.toLocaleDateString('sv-SE'),mk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),today=()=>iso(new Date());
const dmy=s=>String(s).split('-').reverse().join('.');
const dd=s=>new Date(s+'T00:00:00');
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MN=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'],MF=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const hm=t=>new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});

/* ============ хранилище: CloudStorage (кусками по 3000 знаков) + localStorage ============ */
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(_){}return null};
const lj=(k,d)=>{try{const v=ls(k);return v?JSON.parse(v):d}catch(_){return d}};
const CHK=3000,cTimers={};
function cloudGet(k){return new Promise(res=>{try{const cs=tg.CloudStorage;cs.getItem(k+'.n',(e,n)=>{n=+n;
 if(e||!n){cs.getItem(k,(e2,v)=>res(e2||!v?null:v));return}
 cs.getItems(Array.from({length:n},(_,i)=>k+'.'+i),(e3,o)=>{if(e3||!o)return res(null);let s='';for(let i=0;i<n;i++){if(o[k+'.'+i]==null)return res(null);s+=o[k+'.'+i]}res(s)})})}catch(_){res(null)}})}
function cloudSet(k,v){clearTimeout(cTimers[k]);cTimers[k]=setTimeout(()=>{try{const cs=tg.CloudStorage,n=Math.max(1,Math.ceil(v.length/CHK));
 for(let i=0;i<n;i++)cs.setItem(k+'.'+i,v.slice(i*CHK,(i+1)*CHK));cs.setItem(k+'.n',String(n))}catch(_){}},500)}
const store={
 async get(k){const loc=ls(k);let cl=null;try{cl=await Promise.race([cloudGet(k),new Promise(r=>setTimeout(()=>r(null),3000))])}catch(_){}
  if(cl==null)return loc;if(loc==null)return cl;
  if(k=='s'){try{return(JSON.parse(cl)._ts||0)>=(JSON.parse(loc)._ts||0)?cl:loc}catch(_){return loc}}return cl},
 set(k,v){ls(k,v);cloudSet(k,v)}};

/* ============ состояние ============ */
const DEF={cash:0,fees:0,trades:[],base:null,positions:[],real:[],hist:[],monthly:9300,growth:10,delay:12,yield:12,fee:0.3,infl:8,
 steps:[50000,100000,200000,300000,500000],tw:{share:55,bond:35,cash:5,gold:5},theme:'dark',proxy:'',divm:{}};
let S=clone(DEF),K='',M=[],busy=false,Q={},E={ev:[],annual:0,by:{}},DS={q:[],e:[],ts:0},tab='p',rbusy=false,dirty=false;
const FUNDS={LQDT:'mm',SBMM:'mm',TMON:'mm',AKMM:'mm',TMOS:'eq',SBMX:'eq',EQMX:'eq',AKME:'eq',TGLD:'gold',AKGD:'gold',GOLD:'gold',SBGD:'gold',SBGB:'bond',SBRB:'bond',TBRU:'bond',AKFB:'bond'};
const kind=t=>FUNDS[t]?'fund':(/^(SU|RU000)/.test(t)||t.length>=12)?'bond':'share';
const cls=p=>{if(p.kind=='bond')return'bond';if(p.kind=='fund'){const f=FUNDS[p.secid];return f=='mm'?'cash':f=='eq'?'share':f||'share'}return'share'};
const CN={share:'Акции',bond:'Облигации',cash:'Рубли и ден. рынок',gold:'Золото'};
const unit=p=>(Q[p.secid]||{unit:p.avg}).unit;
const clean=p=>(Q[p.secid]||{clean:p.avg}).clean;
const pnPct=p=>(clean(p)/p.avg-1)*100;
function calc(){let v=0,c=0,cl=0,nkd=0,day=0;for(const p of S.positions){const q=Q[p.secid],u=unit(p);v+=u*p.qty;c+=p.avg*p.qty;cl+=clean(p)*p.qty;if(q){nkd+=(q.nkd||0)*p.qty;day+=(q.unit-(q.prev||q.unit))*p.qty}}
 return{v,c,nkd,day,pl:cl-c,plp:c?(cl/c-1)*100:0,tot:v+S.cash}}
function byClass(){const o={share:0,bond:0,cash:S.cash,gold:0};for(const p of S.positions)o[cls(p)]+=unit(p)*p.qty;return o}
const kv=k=>S.positions.filter(p=>p.kind==k).reduce((a,p)=>a+unit(p)*p.qty,0);
const sharesCount=()=>S.positions.filter(p=>p.kind=='share').length;

/* ============ данные Мосбиржи ============ */
const J=async u=>{let r;const c=new AbortController(),tm=setTimeout(()=>c.abort(),15000);
 try{r=await fetch('https://iss.moex.com/iss'+u+(u.includes('?')?'':'?iss.meta=off'),{signal:c.signal})}catch(e){throw new Error('нет связи с биржей')}finally{clearTimeout(tm)}
 if(!r.ok)throw new Error('ошибка '+r.status);return r.json()};
const blk=(j,n)=>{if(Array.isArray(j)){for(const o of j)if(o&&o[n])return o[n];return null}return(j&&j[n])||null};
const rows=b=>{if(!b||!Array.isArray(b.data))return[];const c=b.columns;return b.data.map(r=>Object.fromEntries(c.map((x,i)=>[x,r[i]])))};
function pick(j,b,f){const sec=rows(blk(j,'securities')),md=rows(blk(j,'marketdata'));if(!sec.length)throw new Error('бумага не найдена');let s=sec[0];
 for(const x of b?['TQCB','TQOB','TQIR']:f?['TQTF','TQIF']:['TQBR']){const g=sec.find(r=>r.BOARDID==x);if(g){s=g;break}}
 const m=md.find(r=>r.BOARDID==s.BOARDID)||{},pr=m.LAST||m.LCURRENTPRICE||s.PREVPRICE||s.PREVWAPRICE,pv=s.PREVPRICE||pr;if(!pr)throw new Error('нет цены');
 if(b){const fv=s.FACEVALUE||1000,a=s.ACCRUEDINT||0,c=pr/100*fv,pc=pv/100*fv;return{unit:c+a,clean:c,prev:pc+a,nkd:a,name:s.SHORTNAME,lot:1}}
 return{unit:pr,clean:pr,prev:pv,nkd:0,name:s.SHORTNAME,lot:s.LOTSIZE||1}}
async function candles(path,from){const all=[];for(let st=0;st<5000;st+=500){const r=rows(blk(await J(path+'/candles.json?interval=24&from='+from+'&start='+st+'&iss.meta=off'),'candles'));all.push(...r);if(r.length<500)break}return all}
const candSec=(id,from,board)=>candles('/engines/stock/markets/shares/boards/'+(board||'TQBR')+'/securities/'+id,from);
async function quote(p){const b=p.kind=='bond',f=p.kind=='fund',q='.json?iss.meta=off&iss.only=securities,marketdata',
 urls=b?['/engines/stock/markets/bonds/securities/'+p.secid+q]:f?['/engines/stock/markets/shares/boards/TQTF/securities/'+p.secid+q,'/engines/stock/markets/shares/securities/'+p.secid+q]:['/engines/stock/markets/shares/boards/TQBR/securities/'+p.secid+q,'/engines/stock/markets/shares/securities/'+p.secid+q];
 let err;for(const u of urls){try{return pick(await J(u),b,f)}catch(e){err=e}}
 if(!b){try{const c=(await candSec(p.secid,iso(new Date(Date.now()-10*864e5)),f?'TQTF':'TQBR')).filter(x=>x.close).pop();if(c)return{unit:c.close,clean:c.close,prev:c.open||c.close,nkd:0,name:p.secid,lot:1}}catch(e){err=e}}
 throw err}
/* дивиденды: возвращает [{d,v}] или null, если биржа данных не отдала (тогда без ошибок на экране) */
async function divRows(id){for(const u of['/securities/'+id+'/dividends.json?iss.meta=off','/securities/'+id+'/dividends.json','/securities/'+id+'/dividends.json?iss.only=dividends&iss.meta=off']){
 try{const b=blk(await J(u),'dividends');if(b)return rows(b).filter(x=>x.value&&x.registryclosedate).map(x=>({d:String(x.registryclosedate).slice(0,10),v:+x.value}))}catch(_){}}return null}
async function events(p,t,yn){const o=[];let man=0;
 if(p.kind=='share'){const rs=await divRows(p.secid);
  if(rs){const ya=new Date(t);ya.setFullYear(ya.getFullYear()-1);const fut=rs.filter(r=>dd(r.d)>=t);
   for(const r of fut){const d=dd(r.d);if(d<=yn)o.push({d,s:p.secid,k:'дивиденд',a:r.v*p.qty})}
   for(const r of rs){const d0=dd(r.d);if(d0>=ya&&d0<t){const d=new Date(d0);d.setFullYear(d.getFullYear()+1);
    if(d>=t&&d<=yn&&!fut.some(f=>Math.abs(dd(f.d)-d)<75*864e5))o.push({d,s:p.secid,k:'дивиденд, оценка',a:r.v*p.qty,est:true})}}}
  else if(S.divm[p.secid])man=S.divm[p.secid]*p.qty}
 else if(p.kind=='bond'){const j=await J('/securities/'+p.secid+'/bondization.json?iss.meta=off&iss.only=coupons&limit=100');
  for(const r of rows(blk(j,'coupons'))){if(!r.value)continue;const d=dd(r.coupondate);if(d>=t&&d<=yn)o.push({d,s:p.secid,k:'купон',a:r.value*p.qty})}}
 return{o,a:o.reduce((a,e)=>a+e.a,0)+man}}
async function refresh(){if(rbusy)return;rbusy=true;soft();const t=new Date();t.setHours(0,0,0,0);const yn=new Date(t);yn.setFullYear(yn.getFullYear()+1);
 const res=await Promise.all(S.positions.map(async p=>{const[q,e]=await Promise.allSettled([quote(p),events(p,t,yn)]);return{p,q,e}}));
 const NQ={...Q},NE={ev:[],annual:0,by:{}},nd={q:[],e:[],ts:Date.now()};
 for(const{p,q,e}of res){if(q.status=='fulfilled')NQ[p.secid]=q.value;else nd.q.push(p.secid);
  if(e.status=='fulfilled'){NE.ev.push(...e.value.o);NE.annual+=e.value.a;NE.by[p.secid]=e.value.a}else nd.e.push(p.secid)}
 NE.ev.sort((a,b)=>a.d-b.d);Q=NQ;E=NE;DS=nd;rbusy=false;
 ls('q',JSON.stringify({ts:Date.now(),Q}));ls('e',JSON.stringify({ts:Date.now(),annual:E.annual,by:E.by,ev:E.ev.map(e=>({...e,d:e.d.toISOString()}))}));
 snap();loadBM();soft()}
function snap(){if(!S.positions.length||!S.positions.every(p=>Q[p.secid]))return;const d=today(),tot=Math.round(calc().tot*100)/100,dep=S.trades.filter(t=>t.act=='dep').reduce((a,t)=>a+t.amt,0);
 const l=S.hist[S.hist.length-1];if(l&&l[0]==d){l[1]=tot;l[2]=dep}else S.hist.push([d,tot,dep]);S.hist=S.hist.slice(-1000);save()}

/* ============ сделки, лоты (FIFO), реализованный результат ============ */
function migrate(){S.trades=S.trades||[];S.hist=S.hist||[];S.real=S.real||[];S.tw={...DEF.tw,...(S.tw||{})};S.divm=S.divm||{};
 if(!S.base)S.base={cash:S.cash,fees:S.fees||0,positions:clone(S.positions)};
 for(const p of S.base.positions)p.kind=kind(p.secid)}
function rebuild(){const b=S.base;let cash=b.cash,fees=b.fees||0;const real=[];
 const pos=b.positions.map(p=>({secid:p.secid,kind:p.kind,qty:p.qty,avg:p.avg,lots:[{d:p.d||null,q:p.qty,c:p.avg}]}));
 for(const t of[...S.trades].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.id-b.id)){
  if(t.act=='dep'){cash+=t.amt;continue}

 <label class="hint">Дивиденды на акцию за год вручную, если биржа не отдаёт (строка: ТИКЕР СУММА)</label><textarea id="dv" rows="2" placeholder="SBER 33.3">${Object.entries(S.divm).map(([k,v])=>k+' '+v).join('\n')}</textarea>
 <label class="hint">Свой прокси для новостей (необязательно, адрес с {url}; см. worker.js)</label><input id="px" type="text" value="${esc(S.proxy||'')}" placeholder="https://имя.workers.dev/?url={url}">

/* ============ отрисовка ============ */
let NUMRE;try{NUMRE=new RegExp('(?<![A-Za-z0-9])\\d+(?:[\\s\\u00a0\\u202f.,]\\d+)*(?:[\\s\\u00a0\\u202f]?[%₽])?(?![A-Za-z])','g')}catch(_){NUMRE=/\d+(?:[\s  .,]\d+)*(?:[\s  ]?[%₽])?/g}
function fmt(){const w=document.createTreeWalker($('app'),NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
 for(const n of ns){const p=n.parentElement;if(!p||p.closest('.n,.w,.m,textarea,option,input,script,svg'))continue;const t=n.nodeValue;if(!/\d/.test(t))continue;
  const c=p.closest('.inc')?'w':'n',f=document.createDocumentFragment();let i=0;
  t.replace(NUMRE,(m,o)=>{f.append(t.slice(i,o));const e=document.createElement('span');e.className=c;e.textContent=m;f.append(e);i=o+m.length;return m});f.append(t.slice(i));n.replaceWith(f)}}
function draw(){dirty=false;$('app').className='';const st=rbusy?'<div class="hint" style="margin:0 4px 8px">↻ Обновляю котировки…</div>':'';
 $('app').innerHTML=st+V[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));fmt()}
function soft(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('app').contains(a)){dirty=true;return}draw()}
document.addEventListener('focusout',()=>{setTimeout(()=>{if(dirty){const a=document.activeElement;if(!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))draw()}},300)});
function applyTheme(){const th=S.theme=='tg'?(tg.colorScheme=='light'?'light':'dark'):(S.theme||'dark');document.documentElement.dataset.theme=th;
 const bg=th=='light'?'#f2f4f8':'#06070d';try{tg.setHeaderColor(bg);tg.setBackgroundColor(bg)}catch(_){}}
function centerTab(b,smooth){const nav=document.querySelector('nav');if(!nav||!b)return;const x=b.offsetLeft-(nav.clientWidth-b.offsetWidth)/2;try{nav.scrollTo({left:x,behavior:smooth===false?'auto':'smooth'})}catch(_){nav.scrollLeft=x}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();scrollTo(0,0);centerTab(b);
 if(tab=='n'||tab=='pl')loadNews();if(tab=='pl'||tab=='an')ensureUni()});

/* ============ фон: астероиды и кометы (только тёмная тема) ============ */
(function(){const c=$('sky'),f=$('fly');if(!c||!f)return;const x=c.getContext('2d'),y=f.getContext('2d');
let Wd,H,rocks=[],comets=[],next=0,last=0;const rnd=(a,b)=>a+Math.random()*(b-a);
function size(){const D=Math.min(devicePixelRatio||1,2);Wd=innerWidth;H=innerHeight;for(const[k,q]of[[c,x],[f,y]]){k.width=Wd*D;k.height=H*D;q.setTransform(D,0,0,D,0,0)}
 rocks=Array.from({length:8},()=>{const r=rnd(2.5,7),pts=[];for(let i=0;i<7;i++){const a=i/7*6.283,k=rnd(.65,1.15);pts.push([Math.cos(a)*r*k,Math.sin(a)*r*k*.78])}return{x:rnd(0,Wd),y:rnd(0,H),rot:rnd(0,6.28),pts,o:rnd(.25,.5)}});
 x.clearRect(0,0,Wd,H);rocks.forEach(rock)}
function rock(a){x.save();x.translate(a.x,a.y);x.rotate(a.rot);x.beginPath();a.pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();
 x.fillStyle=`rgba(92,104,130,${a.o})`;x.fill();x.strokeStyle=`rgba(227,197,112,${a.o*.6})`;x.lineWidth=.6;x.stroke();x.restore()}
function spawn(){const dir=Math.random()<.5?1:-1,ang=rnd(.3,.55),sp=rnd(120,190);
 comets.push({x:dir>0?rnd(-.1,.4)*Wd:rnd(.6,1.1)*Wd,y:rnd(-.05,.4)*H,vx:dir*Math.cos(ang)*sp,vy:Math.sin(ang)*sp,len:rnd(80,140),age:0,life:rnd(3.5,5.5)})}
function comet(m){const k=Math.hypot(m.vx,m.vy),tx=m.x-m.vx/k*m.len,ty=m.y-m.vy/k*m.len,e=Math.min(1,m.age*1.5,(m.life-m.age)*1.5),al=.75*Math.max(0,e);
 const g=y.createLinearGradient(tx,ty,m.x,m.y);g.addColorStop(0,'rgba(120,150,255,0)');g.addColorStop(.7,`rgba(170,190,255,${al*.35})`);g.addColorStop(1,`rgba(255,238,200,${al})`);
 y.strokeStyle=g;y.lineWidth=1.3;y.lineCap='round';y.beginPath();y.moveTo(tx,ty);y.lineTo(m.x,m.y);y.stroke();
 const h=y.createRadialGradient(m.x,m.y,0,m.x,m.y,5);h.addColorStop(0,`rgba(255,236,190,${al*.8})`);h.addColorStop(1,'rgba(255,236,190,0)');y.fillStyle=h;y.beginPath();y.arc(m.x,m.y,5,0,6.283);y.fill()}
function frame(t){requestAnimationFrame(frame);if(document.hidden||document.documentElement.dataset.theme=='light'){last=t;return}const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;y.clearRect(0,0,Wd,H);
 if(t>next&&comets.length<2){spawn();next=t+rnd(3000,7000)}
 comets=comets.filter(m=>m.age<m.life);for(const m of comets){m.age+=dt;m.x+=m.vx*dt;m.y+=m.vy*dt;comet(m)}}
size();addEventListener('resize',size);requestAnimationFrame(frame)})();
