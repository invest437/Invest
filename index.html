<style>
:root{--bg:#0b0d12;--card:#12161d;--line:#1f2632;--tx:#f4f7fb;--hint:#929db0;--ac:#e3c570;--bl:#5b8cff;--wa:#f29a4a;--rd:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:14px 14px calc(92px + env(safe-area-inset-bottom));background:var(--bg);color:var(--tx);font:500 15px/1.5 'Manrope',-apple-system,Segoe UI,Roboto,sans-serif;font-variant-numeric:tabular-nums}

.big{font:700 29px/1.15 'Unbounded','Manrope',sans-serif;letter-spacing:-.02em;margin:4px 0}.hint{color:var(--hint);font-size:13px;font-weight:600}b{font-weight:800}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;scrollbar-width:none;background:#0b0d12ee;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}

input,select,textarea{width:100%;padding:12px;margin:4px 0 8px;border:1px solid var(--line);border-radius:12px;background:#0d1117;color:var(--tx);font-size:16px}

label{display:block;margin-top:6px}ul{margin:6px 0 0;padding-left:18px}li{margin:4px 0}
.m{padding:10px 13px;border-radius:14px;margin:8px 0;white-space:pre-wrap;max-width:92%}.m.u{background:#1c2a44;margin-left:auto}.m.a{background:#171d27;border:1px solid var(--line)}

.inc .big{font:800 40px/1.1 'Playfair Display',Georgia,serif;color:#e3c570;letter-spacing:0}.inc .big .w{font:inherit;color:inherit}
.inc .hero{background:linear-gradient(135deg,#2b2511,#10203a 85%);border-color:#4d4222}.inc .up{color:#e3c570}.inc h2{color:#d8bb6a}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
radial-gradient(120% 55% at 12% -8%,rgba(48,74,160,.40),transparent 62%),
radial-gradient(95% 50% at 105% 104%,rgba(170,115,40,.24),transparent 62%),
linear-gradient(180deg,#06070d,#0a0d17 55%,#05060a)}
#fly{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}nav{z-index:5}nav::-webkit-scrollbar{display:none}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px}.tbl td,.tbl th{padding:7px 3px;text-align:right}.tbl td:first-child,.tbl th:first-child{text-align:left}.tbl th{color:var(--hint);font-weight:700;font-size:11px}.tbl tr+tr td{border-top:1px solid var(--line)}.x{background:none;border:0;color:var(--hint);font-size:17px;padding:2px 6px}

input[type=date]::-webkit-date-and-time-value{text-align:left}
.q.on{border-color:var(--ac);color:var(--ac)}.news{display:block;cursor:pointer}.news b{line-height:1.35}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.chips::-webkit-scrollbar{display:none}.chips .q{flex:0 0 auto;margin:0}

.t-buy{background:#e3c5702a;color:#e3c570}.t-sell{background:#f29a4a2a;color:#f29a4a}.t-hold{background:#5b8cff2a;color:#8fb0ff}.idea b{display:block}.why{margin-top:5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.sc td,.sc th{padding:7px 2px}

<div id="app" class="hint">Загрузка…</div>
<nav><button data-t="p"><span>💼</span>Портфель</button><button data-t="i"><span>💰</span>Доход</button><button data-t="g"><span>🎯</span>Цели</button><button data-t="pl"><span>🧭</span>План</button><button data-t="n"><span>📰</span>Новости</button><button data-t="an"><span>🔬</span>Анализ</button><button data-t="s"><span>✍️</span>Сделки</button></nav>
<script>
const tg=(window.Telegram&&window.Telegram.WebApp)||{};try{tg.ready();tg.expand();tg.setHeaderColor('#06070d');tg.setBackgroundColor('#06070d')}catch(_){}
const OWNER=8716613685,uid=(tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.id)||0;
if(uid!==OWNER){document.body.innerHTML='<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#929db0;font:600 16px -apple-system,sans-serif;text-align:center;padding:20px"><div style="font-size:42px">🔒</div>Приватное приложение<div style="font-size:13px;font-weight:500">Откройте его из своего бота в Telegram</div></div>';throw new Error('locked')}
const $=id=>document.getElementById(id);
window.onerror=(m,u,l)=>{$('app').innerHTML='<div class="card dn">Ошибка: '+m+' (строка '+l+')</div>'};
const ls=k=>{try{return localStorage.getItem(k)}catch(_){return null}};
const R=x=>Math.round(x).toLocaleString('ru-RU')+' ₽',P=x=>(x>=0?'+':'')+x.toFixed(1)+'%',C=x=>x>=0?'up':'dn';
const Y=m=>m==null?'>60 лет':m==0?'✅ достигнуто':'≈ '+Math.floor(m/12)+' л. '+m%12+' мес.';
const store={get:k=>Promise.race([new Promise(r=>{try{tg.CloudStorage.getItem(k,(e,v)=>r(e||!v?ls(k):v))}catch(_){r(ls(k))}}),new Promise(r=>setTimeout(()=>r(ls(k)),2500))]),
set:(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}try{tg.CloudStorage.setItem(k,v)}catch(_){}}};
const DEF={cash:0,fees:0,trades:[],base:null,positions:[],monthly:9300,growth:10,delay:12,yield:12,fee:0.3,steps:[50000,100000,200000,300000,500000]};
let K='',M=[],busy=false,S=DEF,Q={},E={ev:[],annual:0},tab='p',status='';
const kind=t=>/^(SU|RU000)/.test(t)||t.length>=12?'bond':'share';
const J=async u=>{let r;try{r=await fetch('https://iss.moex.com/iss'+u)}catch(e){throw new Error('нет связи с биржей')}if(!r.ok)throw new Error('ошибка '+r.status);return r.json()};
const rows=b=>b.data.map(r=>Object.fromEntries(b.columns.map((c,i)=>[c,r[i]])));
function pick(j,b){const sec=rows(j.securities),md=rows(j.marketdata);if(!sec.length)throw new Error('бумага не найдена');let s=sec[0];
 if(b){for(const x of['TQCB','TQOB','TQIR']){const f=sec.find(r=>r.BOARDID==x);if(f){s=f;break}}}else{const f=sec.find(r=>r.BOARDID=='TQBR');if(f)s=f}
 const m=md.find(r=>r.BOARDID==s.BOARDID)||{},pr=m.LAST||m.LCURRENTPRICE||s.PREVPRICE||s.PREVWAPRICE,pv=s.PREVPRICE||pr;if(!pr)throw new Error('нет цены');
 if(b){const f=s.FACEVALUE||1000,a=s.ACCRUEDINT||0;return{unit:pr/100*f+a,prev:pv/100*f+a,name:s.SHORTNAME}}
 return{unit:pr,prev:pv,name:s.SHORTNAME}}
async function quote(p){const b=p.kind=='bond',q='.json?iss.meta=off&iss.only=securities,marketdata',
 urls=b?['/engines/stock/markets/bonds/securities/'+p.secid+q]:['/engines/stock/markets/shares/boards/TQBR/securities/'+p.secid+q,'/engines/stock/markets/shares/securities/'+p.secid+q];
 let err;for(const u of urls){try{return pick(await J(u),b)}catch(e){err=e}}
 if(!b){try{const c=(await cand(p.secid,iso(new Date(Date.now()-10*864e5)))).filter(x=>x.close).pop();if(c)return{unit:c.close,prev:c.open||c.close,name:p.secid}}catch(e){err=e}}
 throw err}
const dd=s=>new Date(s+'T00:00:00');
async function events(p,t,ya,yn){const o=[];let a=0;
 if(p.kind=='share'){const j=await J('/securities/'+p.secid+'/dividends.json?iss.meta=off');
  for(const r of rows(j.dividends)){if(!r.value)continue;const d=dd(r.registryclosedate);
   if(d>=t)o.push({d,s:p.secid,k:'дивиденд',a:r.value*p.qty});if(d>ya)a+=r.value*p.qty}}
 else{const j=await J('/securities/'+p.secid+'/bondization.json?iss.meta=off&iss.only=coupons&limit=100');
  for(const r of rows(j.coupons)){if(!r.value)continue;const d=dd(r.coupondate);
   if(d>=t&&d<=yn){a+=r.value*p.qty;o.push({d,s:p.secid,k:'купон',a:r.value*p.qty})}}}
 return{o,a}}
async function refresh(){status='Обновляю котировки…';draw();const t=new Date();t.setHours(0,0,0,0);
 const ya=new Date(t);ya.setFullYear(ya.getFullYear()-1);const yn=new Date(t);yn.setFullYear(yn.getFullYear()+1);
 const res=await Promise.all(S.positions.map(async p=>{const[q,e]=await Promise.allSettled([quote(p),events(p,t,ya,yn)]);return{p,q,e}}));
 Q={};E={ev:[],annual:0,by:{}};const bq=[],be=[];
 for(const{p,q,e}of res){if(q.status=='fulfilled')Q[p.secid]=q.value;else bq.push(p.secid+' ('+((q.reason&&q.reason.message)||'ошибка')+')');
  if(e.status=='fulfilled'){E.ev.push(...e.value.o);E.annual+=e.value.a;E.by[p.secid]=e.value.a}else be.push(p.secid+' ('+((e.reason&&e.reason.message)||'ошибка')+')')}
 E.ev.sort((a,b)=>a.d-b.d);status=(bq.length?'⚠️ Нет цен: '+bq.join(', ')+'. ':'')+(be.length?'Нет данных о выплатах: '+be.join(', ')+'.':'');draw()}
const unit=p=>(Q[p.secid]||{unit:p.avg}).unit;
const kv=k=>S.positions.filter(p=>p.kind==k).reduce((a,p)=>a+unit(p)*p.qty,0);
const calc=()=>{const v=S.positions.reduce((a,p)=>a+unit(p)*p.qty,0),c=S.positions.reduce((a,p)=>a+p.avg*p.qty,0);return{v,c,tot:v+S.cash}};
function months(need,c,m,r,g,d){r/=100;for(let i=1;i<=720;i++){c=c*(1+r/12)+m;if(i>d&&(i-d)%12==0)m*=1+g/100;if(c>=need)return i}return null}
let N=null,nf='mine',nbusy=false,nerr=0,NL=[],ntot=0;
const KW={SBER:['сбер'],SBERP:['сбер'],GAZP:['газпром'],LKOH:['лукойл'],ROSN:['роснефть'],YDEX:['яндекс'],OZON:['ozon','озон'],MTSS:['мтс'],X5:['x5','пятёрочка','перекрёсток'],T:['т-технологии','тинькофф'],VTBR:['втб'],MGNT:['магнит'],NVTK:['новатэк'],GMKN:['норникель','норильский никель'],PLZL:['полюс'],CHMF:['северсталь'],NLMK:['нлмк'],MAGN:['ммк'],TATN:['татнефть'],SNGS:['сургутнефтегаз'],MOEX:['мосбиржа','московская биржа'],AFLT:['аэрофлот'],PHOR:['фосагро'],ALRS:['алроса'],RUAL:['русал'],HYDR:['русгидро'],IRAO:['интер рао'],RU000A10EJQ7:['атомэнергопром'],RU000A10CMT9:['яндекс']};
const kws=p=>{const k=[...(KW[p.secid]||[])],n=(Q[p.secid]||{}).name;if(n){const w=n.toLowerCase().match(/[а-яёa-z]{4,}/);if(w)k.push(w[0])}if(/^SU/.test(p.secid))k.push('офз');if(!k.length&&p.secid.length>2)k.push(p.secid.toLowerCase());return k};
const rss=async(u,src)=>{const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(u));const j=await r.json();if(j.status!='ok')throw 0;
 return j.items.map(i=>({t:i.title,l:i.link,d:new Date(String(i.pubDate).replace(' ','T')+'Z'),s:src,x:(i.description||'').replace(/<[^>]*>/g,' ')}))};
const qname=p=>(KW[p.secid]||[])[0]||(Q[p.secid]||{}).name||p.secid;
async function loadNews(){nbusy=true;draw();
 const gn=p=>rss('https://news.google.com/rss/search?q='+encodeURIComponent(qname(p)+(p.kind=='bond'?' облигации':' акции')+' when:7d')+'&hl=ru&gl=RU&ceid=RU:ru','Новости').then(a=>a.map(i=>({...i,k:p.secid})));
 const jobs=[J('/sitenews.json?iss.meta=off').then(j=>rows(j.sitenews||j[Object.keys(j)[0]]).map(r=>({t:r.title,l:'https://www.moex.com/n'+r.id,d:new Date(String(r.published_at).replace(' ','T')+'+03:00'),s:'Мосбиржа'}))),
  rss('https://rssexport.rbc.ru/rbcnews/news/30/full.rss','РБК'),rss('https://www.interfax.ru/rss.asp','Интерфакс'),...S.positions.map(gn)];
 const res=await Promise.allSettled(jobs),out=[];res.forEach(r=>{if(r.status=='fulfilled')out.push(...r.value)});
 const seen=new Set();N=out.filter(i=>!isNaN(i.d)&&!seen.has(i.t)&&seen.add(i.t)).sort((a,b)=>b.d-a.d);
 nerr=res.filter(r=>r.status!='fulfilled').length;ntot=jobs.length;nbusy=false;draw()}
function openL(i){const u=NL[i].l;try{tg.openLink(u)}catch(_){window.open(u,'_blank')}}
function ideas(){const{tot}=calc(),L=[],sv=kv('share'),bv=kv('bond'),T=tot+S.monthly;
 const card=(tag,cls,title,why,risk)=>`<div class="card idea"><span class="tag ${cls}">${tag}</span><b>${title}</b><div class="why"><span class="hint">Почему:</span> ${why}</div>${risk?`<div class="why"><span class="hint">Риск:</span> ${risk}</div>`:''}</div>`;
 const fee=v=>R(v*S.fee/100);
 for(const p of S.positions){const v=unit(p)*p.qty,w=v/tot*100,pn=(unit(p)/p.avg-1)*100;
  if(w>25){const q=Math.ceil((v-.2*tot)/unit(p));
   L.push(card('НЕ ДОКУПАТЬ','t-hold',`${p.secid}: пока не добавлять`,`на бумагу приходится ${w.toFixed(0)}% портфеля, а разумный предел 15–20%. Плохая новость по одному эмитенту ударит сразу по всему портфелю. Новые взносы лучше направить в другие бумаги.`,''));
   L.push(card('ПРОДАТЬ (по желанию)','t-sell',`${p.secid}: около ${q} шт ≈ ${R(q*unit(p))}`,`чтобы снизить долю примерно до 20% и освободить деньги для диверсификации.`,`${pn>0?`продажа в плюсе (${P(pn)}) приведёт к налогу НДФЛ с прибыли и комиссии около ${fee(q*unit(p))}`:`продажа зафиксирует убыток (${P(pn)}), комиссия около ${fee(q*unit(p))}`}. Можно обойтись и без продажи, просто докупая другие бумаги.`))}
  else if(pn<-15)L.push(card('ПЕРЕСМОТРЕТЬ','t-hold',`${p.secid}: ${P(pn)} к цене покупки`,`решите, сохранился ли довод, ради которого вы покупали. Если нет, продажа ограничит убыток, и его можно будет учесть при расчёте налога с прибыли (уточните у брокера).`,`продажа фиксирует убыток; если довод в силе, а цена просто упала, часто разумнее держать или усреднять небольшой суммой.`))}
 if(S.cash/tot>.1)L.push(card('КУПИТЬ','t-buy',`Вложить свободные ${R(S.cash)}`,`деньги на счёте не приносят дохода и обесцениваются из-за инфляции. Одна покупка вместо нескольких мелких экономит комиссии (${fee(S.cash)} за всю сумму).`,`рынок может просесть сразу после покупки; если волнуетесь, разделите вложение на 2–3 части по неделям.`));
 const db=.4*T-bv;if(db>tot*.03)L.push(card('КУПИТЬ','t-buy',`Облигации ≈ ${R(db)}`,`доля облигаций ${(bv/tot*100).toFixed(0)}% при ориентире 35–40%. Купоны дают предсказуемый доход и смягчают просадки акций.`,`цены облигаций падают при росте ключевой ставки; у корпоративных есть риск эмитента, смотрите рейтинг.`));
 const SEC={SBER:'b',VTBR:'b',T:'b',MOEX:'b',OZON:'r',X5:'r',MGNT:'r',MTSS:'t',YDEX:'i',LKOH:'o',ROSN:'o',TATN:'o',NVTK:'o',GAZP:'o',SNGS:'o',GMKN:'m',CHMF:'m',NLMK:'m',MAGN:'m',PLZL:'m',IRAO:'e',HYDR:'e',PHOR:'c'};
 const IDEA=[['o','нефтегаза','LKOH или TATN'],['m','металлургии','CHMF или NLMK'],['e','электроэнергетики','IRAO'],['c','химии и удобрений','PHOR']];
 const have=new Set(S.positions.map(p=>SEC[p.secid]).filter(Boolean)),g=IDEA.find(x=>!have.has(x[0]));
 if(g&&sv/T<.55+.1)L.push(card('КУПИТЬ (идея)','t-buy',`Присмотритесь к ${g[2]}`,`в портфеле нет ${g[1]}. Эта отрасль традиционно входит в дивидендное ядро российского рынка и слабо зависит от банков и ритейла, которых у вас много. Ориентир по сумме: около трети ближайшего взноса (${R(S.monthly/3)}).`,`дивиденды не гарантированы и зависят от цен на сырьё и решений компании. Перед покупкой проверьте отчётность и дивидендную политику. Это пример для изучения, а не указание.`));
 return(L.length?'<h2>Что и почему</h2>'+L.slice(0,6).join(''):'<div class="card tip" style="--c:var(--ac)"><b>Структура в порядке</b>Явных перекосов сейчас не видно. Продолжайте регулярные взносы.</div>')+'<h2>Наблюдения</h2>'}
// END ideas
const bar=p=>`<div class="bar"><i style="width:${Math.max(2,Math.min(100,p))}%"></i></div>`;
